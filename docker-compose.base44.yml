services:
  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      # keep container node_modules separate from host
      - node_modules:/app/node_modules
    command: sh -c "npm install && node --watch index.js"
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped

volumes:
  node_modules:
